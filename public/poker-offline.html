<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Poker Table — Offline</title>
  <style>
    html { color-scheme: dark; font-family: system-ui, sans-serif; background: #0a0a0a; color: #f5f5f5; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
    main { width: min(420px, 100%); border: 2px solid #d4af37; border-radius: 24px; background: #0d5c2e; padding: 36px 24px; box-shadow: 0 20px 60px #0009; }
    .suit { color: #f0d77b; font-size: 64px; }
    h1 { margin: 8px 0; }
    p { color: #d1d5db; line-height: 1.5; }
    button { margin-top: 12px; border: 0; border-radius: 999px; background: #d4af37; color: #111; padding: 12px 22px; font: inherit; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="suit" aria-hidden="true">♠</div>
    <h1>You are offline</h1>
    <p>The live table needs a connection. Your app is installed and ready to reconnect.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
